<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenario · Aoe2Scenario</title>
    <style>
        #minimap-stack {
            position: relative;
            display: inline-block;
        }

        #minimap-stack img {
            display: block;
            image-rendering: pixelated;
        }

        #minimap-stack .minimap-overlay {
            position: absolute;
            inset: 0;
        }

        .scenario-message {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1 id="scenario-title"></h1>
    <a href="/">← Back to scenarios</a>
    <p id="error-message" hidden></p>
    <p>File: <span id="scenario-filename"></span></p>
    <p>Uploaded: <span id="scenario-uploaded-at"></span></p>
    <p>File size: <span id="scenario-file-size"></span></p>
    <p>Parser version: <span id="scenario-parser-version"></span></p>
    <p>Game version: <span id="scenario-game-version"></span></p>
    <p>Scenario version: <span id="scenario-version"></span></p>
    <p>Width: <span id="scenario-width"></span></p>
    <p>Height: <span id="scenario-height"></span></p>

    <a id="download-link">Download original scenario</a>
    <button id="delete-button">Delete scenario</button>

    <h2>Minimap</h2>

    <div id="layer-controls">
        <label>
            <input type="checkbox" id="terrain-toggle" checked>
            Terrain
        </label>

        <label>
            <input type="checkbox" id="gaia-toggle" checked>
            Gaia
        </label>

        <label>
            <input type="checkbox" id="players-toggle" checked>
            Players
        </label>
    </div>

    <div id="minimap-stack">
        <img id="terrain-layer" alt="Terrain">
        <img id="gaia-layer" class="minimap-overlay" alt="Gaia">
        <img id="players-layer" class="minimap-overlay" alt="Players">
    </div>

    <h2>Scenario messages</h2>
    <div id="scenario-messages"></div>

    <h2>Players</h2>
    <div id="scenario-players"></div>

    <script>
        const scenarioTitle = document.getElementById("scenario-title");
        const errorMessage = document.getElementById("error-message");

        const scenarioFilename = document.getElementById("scenario-filename");
        const scenarioUploadedAt = document.getElementById("scenario-uploaded-at");
        const scenarioFileSize = document.getElementById("scenario-file-size");
        const scenarioParserVersion = document.getElementById("scenario-parser-version");
        const scenarioGameVersion = document.getElementById("scenario-game-version");
        const scenarioVersion = document.getElementById("scenario-version");
        const scenarioWidth = document.getElementById("scenario-width");
        const scenarioHeight = document.getElementById("scenario-height");

        const terrainLayer = document.getElementById("terrain-layer");
        const gaiaLayer = document.getElementById("gaia-layer");
        const playersLayer = document.getElementById("players-layer");

        const terrainToggle = document.getElementById("terrain-toggle");
        const gaiaToggle = document.getElementById("gaia-toggle");
        const playersToggle = document.getElementById("players-toggle");

        const downloadLink = document.getElementById("download-link");
        const deleteButton = document.getElementById("delete-button");

        const scenarioMessages = document.getElementById("scenario-messages");

        const scenarioPlayers = document.getElementById("scenario-players");

        const scenarioId = window.location.pathname.split("/").pop();

        deleteButton.addEventListener("click", async () => {
            try {
                const response = await fetch(
                    `/api/scenario/${scenarioId}`,
                    {
                        method: "DELETE"
                    }
                );

                if (!response.ok) {
                    const data = await response.json();

                    errorMessage.textContent = data.error;
                    errorMessage.hidden = false;
                    return;
                }

                terrainLayer.removeAttribute("src");
                gaiaLayer.removeAttribute("src");
                playersLayer.removeAttribute("src");

                scenarioMessages.replaceChildren();
                scenarioPlayers.replaceChildren();

                window.location.href = `/`;
            } catch (error) {
                console.error(error);

                errorMessage.textContent =
                    "Unable to delete the scenario.";

                errorMessage.hidden = false;
            }
        });

        terrainToggle.addEventListener("change", () => {
            terrainLayer.style.opacity =
                terrainToggle.checked ? "1" : "0";
        });

        gaiaToggle.addEventListener("change", () => {
            gaiaLayer.style.opacity =
                gaiaToggle.checked ? "1" : "0";
        });

        playersToggle.addEventListener("change", () => {
            playersLayer.style.opacity =
                playersToggle.checked ? "1" : "0";
        });

        async function loadScenario() {
            const response = await fetch(`/api/scenario/${scenarioId}`);
            const data = await response.json();

            if (!response.ok) {
                errorMessage.textContent = data.error;
                errorMessage.hidden = false;
                return;
            }

            const scenarioName = data.original_filename.replace(/\.aoe2scenario$/i, "");
            document.title = `${scenarioName} · Aoe2Scenario`;
            scenarioTitle.textContent = scenarioName;

            scenarioFilename.textContent = data.original_filename;
            scenarioUploadedAt.textContent = new Date(data.uploaded_at * 1000).toLocaleString();
            scenarioFileSize.textContent = formatFileSize(data.file_size);
            scenarioParserVersion.textContent = data.parser_version;
            scenarioGameVersion.textContent = data.scenario.game_version;
            scenarioVersion.textContent = data.scenario.scenario_version;
            scenarioWidth.textContent = data.scenario.width;
            scenarioHeight.textContent = data.scenario.height;

            renderMessages(data.scenario.messages);
            renderPlayers(data.scenario.players);

            terrainLayer.src =
                `/api/scenario/${scenarioId}/minimap/terrain`;

            gaiaLayer.src =
                `/api/scenario/${scenarioId}/minimap/gaia`;

            playersLayer.src =
                `/api/scenario/${scenarioId}/minimap/players`;

            downloadLink.href =
                `/api/scenario/${scenarioId}/download`;
        }


        function renderPlayers(players) {
            scenarioPlayers.replaceChildren();

            for (const player of players) {
                if (!player.active) {
                    continue;
                }

                const playerElement = document.createElement("div");

                const name = document.createElement("h3");
                name.textContent =
                    `Player ${player.id} — ${player.name ?? "Unnamed"}`;
                playerElement.appendChild(name);

                const civilization = document.createElement("p");
                civilization.textContent =
                    `Civilization: ${player.civilization}`;
                playerElement.appendChild(civilization);

                const populationCap = document.createElement("p");
                populationCap.textContent =
                    `Population Cap: ${player.population_cap ?? "Unknown"}`;
                playerElement.appendChild(populationCap);

                const human = document.createElement("p");
                human.textContent =
                    `Type: ${player.human ? "Human" : "AI"}`;
                playerElement.appendChild(human);

                const color = document.createElement("p");
                color.textContent =
                    `Color: ${player.color}`;
                playerElement.appendChild(color);

                const startingAge = document.createElement("p");
                startingAge.textContent =
                    `Starting Age: ${player.starting_age}`;
                playerElement.appendChild(startingAge);

                const resources = document.createElement("p");
                resources.textContent =
                    `Resources: ${player.resources.food} food, ${player.resources.wood} wood, ${player.resources.gold} gold, ${player.resources.stone} stone`;
                playerElement.appendChild(resources);

                scenarioPlayers.appendChild(playerElement);
            }
        }

        function renderMessages(messages) {
            scenarioMessages.replaceChildren();

            const fields = [
                ["Instructions", messages.instructions],
                ["Hints", messages.hints],
                ["Scouts", messages.scouts],
                ["Victory", messages.victory],
                ["Loss", messages.loss],
                ["History", messages.history],
            ];

            for (const [title, text] of fields) {
                if (!text) {
                    continue;
                }

                const section = document.createElement("div");

                const heading = document.createElement("h3");
                heading.textContent = title;

                const content = document.createElement("p");
                content.className = "scenario-message";
                content.textContent = text;

                section.appendChild(heading);
                section.appendChild(content);

                scenarioMessages.appendChild(section);
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) {
                return `${bytes} B`;
            }

            if (bytes < 1024 * 1024) {
                return `${(bytes / 1024).toFixed(1)} KiB`;
            }

            return `${(bytes / (1024 * 1024)).toFixed(1)} MiB`;
        }

        loadScenario();
    </script>
</body>
</html>
