<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aoe2Scenario</title>
</head>
<body>
<h1>Aoe2Scenario</h1>
<input type="file" id="scenario-file" accept=".aoe2scenario">
<button id="upload-button">Upload scenario</button>

<h2>Saved scenarios</h2>
<div id="scenario-list"></div>

<p id="error-message" hidden></p>

<script>
    const fileInput = document.getElementById("scenario-file");
    const uploadButton = document.getElementById("upload-button");
    const scenarioList = document.getElementById("scenario-list");

    const errorMessage = document.getElementById("error-message");

    function scenarioFormData(file) {
        const formData = new FormData();
        formData.append("scenario", file);
        return formData;
    }

    uploadButton.addEventListener("click", async () => {
        errorMessage.hidden = true;

        const file = fileInput.files[0];

        if (!file) {
            errorMessage.textContent = "Please select a scenario file.";
            errorMessage.hidden = false;
            return;
        }

        try {
            const uploadResponse = await fetch("/api/scenario", {
                method: "POST",
                body: scenarioFormData(file)
            });

            const uploadData = await uploadResponse.json();

            if (!uploadResponse.ok) {
                errorMessage.textContent = uploadData.error;
                errorMessage.hidden = false;
                return;
            }

            window.location.href = `/scenario/${uploadData.id}`;
        } catch (error) {
            console.error(error);

            errorMessage.textContent =
                "Unable to process the scenario.";

            errorMessage.hidden = false;
        }
    });

    async function loadScenarios() {
        scenarioList.replaceChildren();

        const response = await fetch("/api/scenarios");
        const scenarios = await response.json();

        if (!response.ok) {
            errorMessage.textContent =
                scenarios.error ?? "Unable to list scenarios.";
            errorMessage.hidden = false;
            return;
        }

        for (const scenario of scenarios) {
            const item = document.createElement("div");

            const name = document.createElement("strong");
            name.textContent = scenario.original_filename;

            const metadata = document.createElement("p");

            const uploadedAt =
                new Date(scenario.uploaded_at * 1000).toLocaleString();

            metadata.textContent =
                `${uploadedAt} · ${formatFileSize(scenario.file_size)}`;

            const loadButton = document.createElement("button");
            loadButton.textContent = "Load";

            loadButton.addEventListener("click", () => {
                window.location.href = `/scenario/${scenario.id}`;
            });

            item.appendChild(name);
            item.appendChild(metadata);
            item.appendChild(loadButton);

            scenarioList.appendChild(item);
        }
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) {
            return `${bytes} B`;
        }

        if (bytes < 1024 * 1024) {
            return `${(bytes / 1024).toFixed(1)} KiB`;
        }

        return `${(bytes / (1024 * 1024)).toFixed(1)} MiB`;
    }

    loadScenarios();
</script>
</body>
</html>
